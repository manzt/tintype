name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
      - run: vp check
      - run: vp test
      - run: vp run build
      - run: vp dlx publint

      - name: Get previous version
        id: prev
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - run: vp pm publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Generate release notes
        run: >
          node --experimental-strip-types scripts/generate-release-notes.ts
          "${{ steps.prev.outputs.version }}" "${{ steps.version.outputs.version }}"
          > release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: gh release create "${{ steps.version.outputs.version }}" -F release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
